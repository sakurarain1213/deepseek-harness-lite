name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Test
        run: corepack pnpm test
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Compatibility package typecheck
        run: corepack pnpm exec tsc -p packages/compat/tsconfig.json --pretty false
      - name: Build
        run: corepack pnpm build
      - name: CLI process checks
        run: corepack pnpm vitest run apps/cli/tests/cli.e2e.spec.ts
      - name: Capability pack checks
        run: corepack pnpm vitest run packages/core/tests/packs.spec.ts packages/core/tests/manifest.spec.ts
      - name: Package content checks
        run: corepack pnpm vitest run packages/core/tests/packed-production.spec.ts
      - name: Repository gates
        run: node scripts/verify-repo.mjs
      - name: Secret scan
        run: node scripts/check-secrets.mjs
      - name: License audit
        run: node scripts/check-licenses.mjs
